observation_model = "hough_ransac_line"

[hough]
theta_bins = 180
rho_bins = 200
min_votes = 15
max_lines = 60
inlier_distance = 0.12
min_segment_length = 0.5
merge_rho = 0.15
merge_theta = 0.06

[ekf]
process_noise_translation = 0.05
process_noise_rotation = 0.03
measurement_noise_range = 0.12
measurement_noise_angle = 0.12

[association]
max_association_distance = 0.3
segment_margin = 0.3
gate_threshold = 6.0
min_observations = 3

[ransac]
max_iterations = 80
min_inliers = 3
min_inlier_ratio = 0.25

[initial_covariance]
xx = 0.5
yy = 0.5
tt = 0.2
