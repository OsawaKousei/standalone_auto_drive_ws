[localization]
localizer = "ekf"
observation_model = "ransac_line_association"

[localization.localizer.ekf]
process_noise_translation = 0.05
process_noise_rotation = 0.03

[localization.localizer.initial_covariance]
xx = 0.5
yy = 0.5
tt = 0.2

[localization.observation.line_based]
measurement_noise_range = 0.12
measurement_noise_angle = 0.12
gate_threshold = 4.5
min_observations = 1

[localization.observation.line_based.map_line_extraction]
max_lines = 40
min_segment_length = 0.8

[localization.observation.models.ransac_line_association]
use_ekf_gate = true
segment_margin = 0.7

[localization.observation.models.ransac_line_association.stage1]
point_distance_threshold = 0.5
min_inlier_points = 5
max_iterations = 400
max_extracted_scan_lines = 10
min_segment_length = 0.2
min_remaining_points = 1
local_pca_window_size = 4
sample_neighbor_window = 18
min_direction_alignment = 0.5
min_linearity = 0.25
max_continuity_gap = 3

[localization.observation.models.ransac_line_association.stage2]
translation_ransac_iterations = 1000
line_angle_threshold = 0.314
line_rho_threshold = 0.5
parallel_reject_threshold = 0.05
min_pose_inliers = 3

[localization.observation.models.ransac_line_association.stage4]
context_gate_threshold = 9.21
