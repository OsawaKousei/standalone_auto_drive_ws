[localization]
localizer = "ekf"
observation_model = "ransac_line_association"

[localization.localizer.ekf]
process_noise_translation = 0.05
process_noise_rotation = 0.03

[localization.localizer.initial_covariance]
xx = 0.5
yy = 0.5
tt = 0.2

[localization.observation.line_based]
measurement_noise_range = 0.12
measurement_noise_angle = 0.12
gate_threshold = 4.5
min_observations = 2

[localization.observation.line_based.map_line_extraction]
max_lines = 40
min_segment_length = 0.8

[localization.observation.models.ransac_line_association]
use_ekf_gate = true
segment_margin = 0.3

[localization.observation.models.ransac_line_association.stage1]
point_distance_threshold = 0.08
min_inlier_points = 16
max_iterations = 80
max_extracted_scan_lines = 12
min_segment_length = 0.5
min_remaining_points = 30

[localization.observation.models.ransac_line_association.stage2]
max_iterations = 120
line_angle_threshold = 0.1
line_rho_threshold = 0.2
parallel_reject_threshold = 0.05
min_pose_inliers = 2
