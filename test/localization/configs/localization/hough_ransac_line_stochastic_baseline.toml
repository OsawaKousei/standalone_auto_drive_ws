observation_model = "hough_ransac_line"

[hough]
theta_bins = 180
rho_bins = 200
min_votes = 25
max_lines = 40
inlier_distance = 0.12
min_segment_length = 0.8
merge_rho = 0.2
merge_theta = 0.08

[ekf]
process_noise_translation = 0.05
process_noise_rotation = 0.03
measurement_noise_range = 0.20
measurement_noise_angle = 0.20

[association]
max_association_distance = 0.3
segment_margin = 0.3
gate_threshold = 6.0
min_observations = 3

[ransac]
max_iterations = 80
inlier_distance = 0.10
min_inliers = 8
min_inlier_ratio = 0.35
min_inlier_span = 0.5

[initial_covariance]
xx = 0.5
yy = 0.5
tt = 0.2
