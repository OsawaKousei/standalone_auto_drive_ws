[scenario]
name = "localization_test"

[map]
yaml_path = "../../../tools/map.yaml"

[robot.start]
x = 1.0
y = 1.0
theta = 1.57

[robot.goal]
x = 9.0
y = 1.0
theta = -1.57

[robot.footprint]
vertices = [-0.2, -0.1, 0.3, -0.1, 0.3, 0.1, -0.2, 0.1]

[simulation.runtime]
step_seconds = 0.01
lidar_delta_t = 0.20
render_delta_t = 0.10
max_steps = 10000
goal_tolerance = 0.30

[simulation.collision]
max_translation_step = 0.05
max_rotation_step = 0.05

[localization]
algorithm = "ekf"
config_path = "/workspace/test/localization/configs/localization/ekf_hough_ransac.toml"

[planning]
algorithm = "astar"
config_path = "../../../configs/defaults/planning/astar.toml"

[control]
algorithm = "pure_pursuit"
config_path = "../../../configs/defaults/control/pure_pursuit.toml"

[lidar_sensor]
algorithm = "lidar"
config_path = "/workspace/test/localization/logs/analysis/lidar_randomness_sweep/tmp_configs/lidar_noise_0.1000.toml"

[odometry_sensor]
algorithm = "odometry"
config_path = "../../../configs/defaults/sensor/odometry.toml"

[physics]
algorithm = "unicycle"
config_path = "../../../configs/defaults/physics/unicycle.toml"
