[scenario]
name = "path_following_test"

[map]
yaml_path = "../../../tools/map.yaml"

[robot.start]
x = 1.0
y = 1.0
theta = 1.57

[robot.goal]
x = 9.0
y = 1.0
theta = -1.57

[robot.footprint]
vertices = [-0.2, -0.1, 0.3, -0.1, 0.3, 0.1, -0.2, 0.1]

[simulation.runtime]
step_seconds = 0.01
max_steps = 10000
goal_tolerance = 0.25

[simulation.collision]
max_translation_step = 0.05
max_rotation_step = 0.05

[planning]
algorithm = "astar"
config_path = "planning/astar.toml"

[control]
algorithm = "pure_pursuit"
config_path = "control/pure_pursuit.toml"

[odometry_sensor]
algorithm = "odometry"
config_path = "sensor/odometry_ideal.toml"

[physics]
algorithm = "holonomic"
config_path = "physics/holonomic_ideal.toml"
